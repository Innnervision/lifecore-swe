<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EA4335;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9334E6;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1A2744" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Left side: Architecture nodes -->
  <!-- AST Graph node -->
  <circle cx="160" cy="200" r="48" fill="none" stroke="#4285F4" stroke-width="2"/>
  <circle cx="160" cy="200" r="40" fill="#0D1F3C"/>
  <text x="160" y="196" text-anchor="middle" font-size="9" fill="#4285F4" font-weight="bold">AST</text>
  <text x="160" y="208" text-anchor="middle" font-size="9" fill="#4285F4">GRAPH</text>

  <!-- Pos Experience node -->
  <circle cx="160" cy="340" r="48" fill="none" stroke="#34A853" stroke-width="2"/>
  <circle cx="160" cy="340" r="40" fill="#0D1F3C"/>
  <text x="160" y="336" text-anchor="middle" font-size="8" fill="#34A853" font-weight="bold">POSITIVE</text>
  <text x="160" y="348" text-anchor="middle" font-size="8" fill="#34A853">OVERLAY</text>

  <!-- Neg Experience node -->
  <circle cx="160" cy="480" r="48" fill="none" stroke="#EA4335" stroke-width="2"/>
  <circle cx="160" cy="480" r="40" fill="#0D1F3C"/>
  <text x="160" y="476" text-anchor="middle" font-size="8" fill="#EA4335" font-weight="bold">NEGATIVE</text>
  <text x="160" y="488" text-anchor="middle" font-size="8" fill="#EA4335">OVERLAY</text>

  <!-- Connecting lines to center -->
  <line x1="208" y1="200" x2="490" y2="310" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <line x1="208" y1="340" x2="490" y2="325" stroke="#34A853" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <line x1="208" y1="480" x2="490" y2="340" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>

  <!-- Center: Unified Context Box -->
  <rect x="490" y="270" width="300" height="100" rx="10" fill="#1A2744" stroke="url(#glow1)" stroke-width="2"/>
  <text x="640" y="295" text-anchor="middle" font-size="11" fill="#AAB4BE">Unified World Model</text>
  <text x="640" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Context Builder</text>
  <text x="640" y="335" text-anchor="middle" font-size="10" fill="#4285F4">4-Stream Evidence Synthesis</text>
  <text x="640" y="355" text-anchor="middle" font-size="9" fill="#666">Truth boundaries enforced</text>

  <!-- Arrow to Gemma -->
  <line x1="790" y1="320" x2="870" y2="320" stroke="#AAB4BE" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Gemma 4 box -->
  <rect x="870" y="280" width="220" height="80" rx="10" fill="#1565C0" stroke="#4285F4" stroke-width="2"/>
  <text x="980" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Gemma 4</text>
  <text x="980" y="326" text-anchor="middle" font-size="10" fill="#90CAF9">gemma-4-26b-a4b-it</text>
  <text x="980" y="344" text-anchor="middle" font-size="9" fill="#64B5F6">temperature=0.1</text>

  <!-- Results bar bottom -->
  <rect x="490" y="430" width="300" height="70" rx="8" fill="#0A1628" stroke="#333" stroke-width="1"/>
  <text x="640" y="453" text-anchor="middle" font-size="10" fill="#AAB4BE">Condition E (No Text Injection)</text>
  <!-- Bar chart mini -->
  <rect x="510" y="460" width="50" height="20" fill="#4285F4" rx="2"/>
  <rect x="575" y="466" width="50" height="14" fill="#34A853" rx="2"/>
  <rect x="640" y="462" width="50" height="18" fill="#FBBC04" rx="2"/>
  <rect x="705" y="456" width="50" height="24" fill="#EA4335" rx="2"/>
  <text x="535" y="456" text-anchor="middle" font-size="8" fill="#4285F4">B</text>
  <text x="600" y="462" text-anchor="middle" font-size="8" fill="#34A853">C</text>
  <text x="665" y="458" text-anchor="middle" font-size="8" fill="#FBBC04">D</text>
  <text x="730" y="452" text-anchor="middle" font-size="8" fill="#EA4335">E★</text>

  <!-- Main title -->
  <text x="640" y="72" text-anchor="middle" font-size="42" font-weight="bold" fill="white">LIFECORE-SWE</text>
  <text x="640" y="110" text-anchor="middle" font-size="18" fill="#4285F4">Experience-Conditioned Code Graphs</text>
  <text x="640" y="136" text-anchor="middle" font-size="13" fill="#AAB4BE">Encoding Verified Agent Trajectories as Structural Priors Over Repository Graph Edges</text>

  <!-- Key metric badges -->
  <rect x="100" y="560" width="160" height="50" rx="8" fill="#0D2B0D" stroke="#34A853" stroke-width="1.5"/>
  <text x="180" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#34A853">100%</text>
  <text x="180" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">Task Success Rate</text>

  <rect x="280" y="560" width="160" height="50" rx="8" fill="#0D1F3C" stroke="#4285F4" stroke-width="1.5"/>
  <text x="360" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#4285F4">36%</text>
  <text x="360" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">Lower Latency</text>

  <rect x="460" y="560" width="160" height="50" rx="8" fill="#1A0A2E" stroke="#9334E6" stroke-width="1.5"/>
  <text x="540" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#9334E6">121</text>
  <text x="540" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">Tests Passing</text>

  <rect x="640" y="560" width="160" height="50" rx="8" fill="#1A0A0A" stroke="#EA4335" stroke-width="1.5"/>
  <text x="720" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#EA4335">0%</text>
  <text x="720" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">Search Thrashing</text>

  <rect x="820" y="560" width="160" height="50" rx="8" fill="#1A1400" stroke="#FBBC04" stroke-width="1.5"/>
  <text x="900" y="582" text-anchor="middle" font-size="22" font-weight="bold" fill="#FBBC04">5</text>
  <text x="900" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">Milestones (M0-M5)</text>

  <rect x="1000" y="560" width="180" height="50" rx="8" fill="#0D1F3C" stroke="#4285F4" stroke-width="1.5"/>
  <text x="1090" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#4285F4">Gemma 4</text>
  <text x="1090" y="600" text-anchor="middle" font-size="10" fill="#AAB4BE">google/gemma-4-26b-a4b-it</text>

  <!-- Google DeepMind badge -->
  <rect x="1050" y="30" width="200" height="36" rx="8" fill="#1565C0" stroke="#4285F4" stroke-width="1"/>
  <text x="1150" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Google DeepMind</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#AAB4BE"/>
    </marker>
  </defs>
</svg>
