  <text x="330" y="506" text-anchor="middle" font-size="11" fill="#AAB4BE">Welch t = 3.45, p = 0.024, Cohen's d = 2.18</text>
  <text x="330" y="530" text-anchor="middle" font-size="12" fill="white">B vs E (execution time, Wilcoxon)</text>
  <text x="330" y="548" text-anchor="middle" font-size="11" fill="#AAB4BE">W = 1.0, p = 0.080 · E faster in 4/5 tasks</text>
  <text x="330" y="572" text-anchor="middle" font-size="10" fill="#666">* Stateless efficiency reflects completed tasks only</text>

  <rect x="640" y="438" width="600" height="160" rx="8" fill="#0D2B0D" stroke="#34A853" stroke-width="1"/>
  <text x="940" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#34A853">Reproducibility</text>
