  <text x="940" y="530" text-anchor="middle" font-size="11" fill="#AAB4BE">Reproduction scripts for all conditions</text>
  <text x="940" y="555" text-anchor="middle" font-size="12" fill="#4285F4">github.com/Innnervision/lifecore-swe</text>
