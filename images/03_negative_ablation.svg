<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="640" fill="#EA4335"/>

  <text x="640" y="55" text-anchor="middle" font-size="13" fill="#EA4335" font-weight="bold">M4 SAFETY ABLATION</text>
  <text x="640" y="92" text-anchor="middle" font-size="34" font-weight="bold" fill="white">Attribution Filtering is Not Optional</text>
  <text x="640" y="128" text-anchor="middle" font-size="15" fill="#AAB4BE">Penalizing all edges in a failed trajectory collapses task success to 0% — only STRONG/VERIFIED attribution is safe</text>

  <!-- Three condition blocks -->
  <!-- Full system -->
  <rect x="60" y="160" width="340" height="320" rx="10" fill="#0D2B0D" stroke="#34A853" stroke-width="2"/>
  <text x="230" y="195" text-anchor="middle" font-size="13" fill="#34A853" font-weight="bold">Full M4 System</text>
  <text x="230" y="215" text-anchor="middle" font-size="11" fill="#AAB4BE">Causal attribution filter ON</text>
  <text x="230" y="270" text-anchor="middle" font-size="52" font-weight="bold" fill="#34A853">100%</text>
  <text x="230" y="310" text-anchor="middle" font-size="14" fill="#34A853">Task Success Rate</text>
  <line x1="100" y1="330" x2="360" y2="330" stroke="#1A3A1A" stroke-width="1"/>
  <text x="230" y="355" text-anchor="middle" font-size="11" fill="#AAB4BE">Avg tool calls: 5.75</text>
  <text x="230" y="375" text-anchor="middle" font-size="11" fill="#AAB4BE">False neg guidance: 0.0%</text>
  <text x="230" y="395" text-anchor="middle" font-size="11" fill="#AAB4BE">Score floor: ≥ 0.15 enforced</text>
  <text x="230" y="415" text-anchor="middle" font-size="11" fill="#AAB4BE">Only STRONG + VERIFIED penalized</text>
  <rect x="110" y="440" width="240" height="28" rx="6" fill="#34A853"/>
  <text x="230" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SAFE ✓</text>

  <!-- Ablation 1 -->
  <rect x="470" y="160" width="340" height="320" rx="10" fill="#2B0A0A" stroke="#EA4335" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-size="13" fill="#EA4335" font-weight="bold">Ablation 1: No Attribution Filter</text>
  <text x="640" y="215" text-anchor="middle" font-size="11" fill="#AAB4BE">All visited edges penalized</text>
  <text x="640" y="270" text-anchor="middle" font-size="52" font-weight="bold" fill="#EA4335">0%</text>
  <text x="640" y="310" text-anchor="middle" font-size="14" fill="#EA4335">Task Success Rate</text>
  <line x1="510" y1="330" x2="770" y2="330" stroke="#3A1A1A" stroke-width="1"/>
  <text x="640" y="355" text-anchor="middle" font-size="11" fill="#AAB4BE">Avg tool calls: 10.50</text>
  <text x="640" y="375" text-anchor="middle" font-size="11" fill="#AAB4BE">Valid paths poisoned</text>
  <text x="640" y="395" text-anchor="middle" font-size="11" fill="#AAB4BE">Agent starved of target nodes</text>
  <text x="640" y="415" text-anchor="middle" font-size="11" fill="#EA4335" font-weight="bold">CATASTROPHIC FAILURE</text>
  <rect x="520" y="440" width="240" height="28" rx="6" fill="#EA4335"/>
  <text x="640" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DANGEROUS ✗</text>

  <!-- Ablation 2 -->
  <rect x="880" y="160" width="340" height="320" rx="10" fill="#2B1A0A" stroke="#FBBC04" stroke-width="2"/>
  <text x="1050" y="195" text-anchor="middle" font-size="13" fill="#FBBC04" font-weight="bold">Ablation 2: No Recency Decay</text>
  <text x="1050" y="215" text-anchor="middle" font-size="11" fill="#AAB4BE">Penalties never expire</text>
  <text x="1050" y="270" text-anchor="middle" font-size="52" font-weight="bold" fill="#FBBC04">0%</text>
  <text x="1050" y="310" text-anchor="middle" font-size="14" fill="#FBBC04">Task Success Rate</text>
  <line x1="920" y1="330" x2="1180" y2="330" stroke="#3A2A0A" stroke-width="1"/>
  <text x="1050" y="355" text-anchor="middle" font-size="11" fill="#AAB4BE">Avg tool calls: 11.00</text>
  <text x="1050" y="375" text-anchor="middle" font-size="11" fill="#AAB4BE">Stale penalties permanent</text>
  <text x="1050" y="395" text-anchor="middle" font-size="11" fill="#AAB4BE">Recovery paths blocked forever</text>
  <text x="1050" y="415" text-anchor="middle" font-size="11" fill="#FBBC04" font-weight="bold">STALE POISONING</text>
  <rect x="930" y="440" width="240" height="28" rx="6" fill="#FBBC04"/>
  <text x="1050" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">UNSAFE ✗</text>

  <!-- Bottom lesson -->
  <rect x="60" y="510" width="1160" height="80" rx="8" fill="#0A1628" stroke="#4285F4" stroke-width="1.5"/>
  <text x="640" y="538" text-anchor="middle" font-size="12" fill="#4285F4" font-weight="bold">Scientific Rule Verified</text>
  <text x="640" y="560" text-anchor="middle" font-size="13" fill="white">Most edges in a failed trajectory are valid paths. Penalizing all of them is worse than having no memory at all.</text>
  <text x="640" y="580" text-anchor="middle" font-size="11" fill="#AAB4BE">Only STRONG or VERIFIED causal attribution qualifies for edge demotion. Score floor ≥ 0.15 prevents disconnection.</text>
</svg>
